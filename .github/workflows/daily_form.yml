name: Daily Google Form Auto-Fill Bot

on:
  schedule:
    # 05:30 UTC = 11:00 AM IST (Asia/Kolkata), Monday through Friday
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

jobs:
  submit-form:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: daily-google-form-submission
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Restore Auth Session from Secret
        env:
          AUTH_JSON_SECRET: ${{ secrets.AUTH_JSON }}
        run: |
          python restore_auth.py

      - name: Run Form Submission Bot
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
        run: |
          python main.py --run-now



      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
